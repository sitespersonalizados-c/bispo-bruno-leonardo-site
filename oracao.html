<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido de Oração - Bispo Bruno Leonardo</title>
    <link rel="stylesheet" href="assets/css/oracao.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

</head>

<body>

    <main class="form-container">
        <header>
            <img src="assets/img/logo/logo.webp" alt="Logo Bispo Bruno Leonardo" class="logo-oracao" width="243"
                height="123" fetchpriority="high">

            <h1>Pedido de Oração</h1>
            <p>Escreva seu pedido abaixo. Ele será copiado para você colar no Direct do Bispo Bruno Leonardo.</p>
        </header>

        <section>
            <div class="campo">
                <label for="nome">Seu Nome</label>
                <input type="text" id="nome" placeholder="Seu nome completo" required>
            </div>

            <div class="campo">
                <label for="pedido">Sua Petição</label>
                <textarea id="pedido" rows="5" placeholder="Escreva aqui o que Deus deve fazer na sua vida..."
                    required></textarea>
            </div>

            <button type="button" onclick="enviarParaInstagram()" class="btn-enviar">
                <i class="fab fa-instagram"></i> COPIAR E ABRIR DIRECT
            </button>

            <div id="aviso-copia">✓ Pedido copiado! Cole na conversa do Bispo.</div>
        </section>

        <footer>
            <a href="index.html" class="voltar">
                <i class="fas fa-arrow-left"></i> Voltar ao Portal
            </a>
        </footer>
    </main>

    <script>
        function enviarParaInstagram() {
            const nome = document.getElementById('nome').value;
            const pedido = document.getElementById('pedido').value;

            if (!nome || !pedido) {
                alert("Por favor, preencha seu nome e o seu pedido.");
                return;
            }

            // Formata o texto
            const textoCompleto = `Olá Bispo Bruno, meu nome é ${nome}. Gostaria de pedir oração: ${pedido}`;

            // Copia para a área de transferência
            navigator.clipboard.writeText(textoCompleto).then(() => {
                // Mostra aviso de sucesso
                document.getElementById('aviso-copia').style.display = 'block';

                // Abre o Direct do Bispo em 1 segundo
                setTimeout(() => {
                    window.open('https://ig.me/m/bispobrunoleonardo', '_blank');
                }, 1200);
            });
        }
    </script>

</body>

</html>
